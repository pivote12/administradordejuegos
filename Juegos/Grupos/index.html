<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupos</title>
  <link rel="stylesheet" href="styles.css?v=grupos1" />
  <link rel="stylesheet" href="../../shared-music.css?v=global1" />
</head>
<body>
  <section id="screenTitle" class="screen active">
    <div class="card">
      <p class="badge">🧩</p>
      <h1>Grupos</h1>
      <p>Elegí un pack, tocá un divisor y formá equipos respetando amistades, enemistades, grupos y familias.</p>
      <p class="creator">Creador: José Rafael Rodriguez Morillo</p>
      <button type="button" class="btn primary" id="btnStart">Jugar</button>
      <a class="btn ghost" href="../../index.html">Volver al administrador</a>
    </div>
  </section>

  <section id="screenPacks" class="screen">
    <div class="card wide">
      <button type="button" class="btn ghost" id="btnBackTitle">←</button>
      <h2>Elegí un pack</h2>
      <p class="hint">Después vas a ver los divisores de la cantidad de pelotitas.</p>
      <div id="packList" class="pack-list"></div>
    </div>
  </section>

  <section id="screenDivide" class="screen">
    <div class="card wide">
      <button type="button" class="btn ghost" id="btnBackPacks">←</button>
      <h2 id="divideTitle">Divisores</h2>
      <p id="divideHint" class="hint"></p>
      <div id="divisorList" class="divisor-list"></div>
      <p id="divideStatus" class="status"></p>
    </div>
  </section>

  <section id="screenTeams" class="screen">
    <div class="card wide">
      <button type="button" class="btn ghost" id="btnBackDivide">←</button>
      <h2 id="teamsTitle">Equipos</h2>
      <p id="teamsHint" class="hint"></p>
      <div id="teamList" class="team-list"></div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btnAgain">Otro divisor</button>
        <button type="button" class="btn ghost" id="btnChangePack">Cambiar pack</button>
      </div>
    </div>
  </section>

  <div class="now-playing" id="nowPlaying">
    <div class="now-playing-controls">
      <button type="button" class="music-btn" id="btnMusicStop" title="Pausar">▶</button>
      <button type="button" class="music-btn" id="btnMusicPrev" title="Anterior">⏮</button>
      <button type="button" class="music-btn" id="btnMusicNext" title="Siguiente">⏭</button>
    </div>
    <p class="now-playing-info">
      <span class="now-playing-label">Canción:</span>
      <span class="now-playing-title" id="nowPlayingTitle">—</span>
    </p>
  </div>

  <script src="../../shared-packs.js?v=packs5"></script>
  <script src="../../shared-music.js?v=global5"></script>
  <script src="game.js?v=grupos1"></script>
</body>
</html>
