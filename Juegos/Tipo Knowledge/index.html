<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Tipo Knowledge</title>
  <link rel="stylesheet" href="styles.css?v=tipo7" />
  <link rel="stylesheet" href="../../shared-music.css?v=global1" />
</head>
<body>
  <div id="app">
    <section id="screenPlaces" class="screen active">
      <div class="wrap">
        <header class="hero card">
          <div class="badge">🧠</div>
          <h1 data-i18n="title">Tipo Knowledge</h1>
          <p class="hint" data-i18n="subtitle">Creá un Lugar De Tipo, definí equipos y descubrí el tipo de cada pelotita.</p>
        </header>

        <form id="placeForm" class="card place-form">
          <h2 data-i18n="placesTitle">Lugares De Tipo</h2>
          <label class="sr-only" for="placeName" data-i18n="placePlaceholder">Nombre del Lugar De Tipo</label>
          <div class="form-row">
            <input id="placeName" name="placeName" maxlength="40" required autocomplete="off" placeholder="Nombre del Lugar De Tipo" data-i18n-placeholder="placePlaceholder" />
            <button type="submit" class="btn primary" data-i18n="createPlace">Crear Lugar De Tipo</button>
          </div>
        </form>

        <p id="noPlaces" class="empty" data-i18n="noPlaces">Todavía no hay Lugares De Tipo.</p>
        <ul id="placeList" class="place-list"></ul>

        <a class="btn ghost back-admin" href="../../index.html" data-i18n="backToAdmin">Volver al administrador</a>
      </div>
    </section>

    <section id="screenPlace" class="screen">
      <div class="wrap">
        <header class="place-head">
          <button type="button" class="btn icon" id="btnBackPlace" aria-label="Volver">←</button>
          <h1 id="placeTitle"></h1>
          <a class="btn ghost compact" href="../../index.html" data-i18n="backToAdmin">Volver al administrador</a>
        </header>
        <nav id="placeTabs" class="tabs"></nav>
        <div id="placeBody"></div>
      </div>
    </section>
  </div>

  <div class="now-playing" id="nowPlaying">
    <div class="now-playing-controls">
      <button type="button" class="music-btn" id="btnMusicStop" title="Pausar">▶</button>
      <button type="button" class="music-btn" id="btnMusicPrev" title="Anterior">⏮</button>
      <button type="button" class="music-btn" id="btnMusicNext" title="Siguiente">⏭</button>
    </div>
    <p class="now-playing-info">
      <span class="now-playing-label" data-i18n="songPlaying">Canción:</span>
      <span class="now-playing-title" id="nowPlayingTitle">—</span>
    </p>
  </div>

  <script src="../../i18n.js?v=tipo7"></script>
  <script src="../../shared-packs.js?v=packs1"></script>
  <script src="../../shared-music.js?v=global1"></script>
  <script src="game.js?v=tipo7"></script>
</body>
</html>
